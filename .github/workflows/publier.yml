# Garde le site aligné sur les versions officielles des Craft Apps.
# Toutes les 3 heures : vérifie si une app a publié une nouvelle version et, seulement dans ce cas, reconstruit et republie.
# À chaque modification du dépôt ou lancement manuel (onglet Actions, « Run workflow ») : reconstruit toujours.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://europasoft-eu.github.io/craft/

jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Comparer avec les dernières versions officielles
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            python3 build.py --check "$SITE_URL" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  construire:
    needs: verifier
    if: needs.verifier.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Construire le site
        run: python build.py --out _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
